basePath: /api
definitions:
  domain.Bed:
    properties:
      created_at:
        type: string
      customer_id:
        description: 当前入住客户ID
        type: string
      id:
        type: string
      number:
        description: 床位号，如 "A101-1"
        type: string
      room_id:
        type: string
      status:
        description: 状态："空闲"/"占用"/"维护中"
        type: string
      updated_at:
        type: string
    required:
    - number
    - room_id
    type: object
  domain.CareLevel:
    properties:
      content:
        description: 护理内容描述
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      level:
        description: 级别数字：1、2、3等
        type: integer
      name:
        description: 如"一级护理"、"二级护理"
        type: string
      price:
        description: 护理费用
        type: number
      updated_at:
        type: string
    required:
    - name
    type: object
  domain.CareRecords:
    properties:
      customer_id:
        type: string
      customer_name:
        description: 老人姓名
        type: string
      id:
        type: string
      records:
        items:
          $ref: '#/definitions/domain.RecordItems'
        type: array
      updated_at:
        type: string
    required:
    - customer_name
    type: object
  domain.CheckOutRequest:
    properties:
      created_by:
        type: string
      customer_id:
        type: string
      note:
        type: string
    required:
    - created_by
    - customer_id
    type: object
  domain.CreateBed:
    properties:
      number:
        type: string
      room_id:
        type: string
      status:
        type: string
    type: object
  domain.Customer:
    properties:
      age:
        type: integer
      allergy_history:
        description: 过敏史
        type: string
      bed_id:
        description: 关联床位
        type: string
      care_level_id:
        description: 护理级别ID
        type: string
      check_in_date:
        description: 入住日期
        type: string
      check_out_date:
        description: 退住日期
        type: string
      contact_address:
        description: 联系地址
        type: string
      contact_name:
        description: 紧急联系人
        type: string
      contact_phone:
        description: 联系电话
        type: string
      created_at:
        type: string
      diet_plan_id:
        description: 膳食计划ID
        type: string
      gender:
        type: string
      health_level:
        description: 健康状况
        type: string
      health_manager:
        description: 健康管家姓名
        type: string
      health_manager_id:
        description: 健康管家ID
        type: string
      id:
        type: string
      id_card:
        description: 身份证号
        type: string
      medical_history:
        description: 既往病史
        type: string
      medication:
        description: 用药情况
        type: string
      name:
        type: string
      phone:
        type: string
      relationship:
        description: 关系
        type: string
      remarks:
        description: 备注说明
        type: string
      status:
        description: 状态："入住中"/"已退住"/"外出中"
        type: string
      updated_at:
        type: string
      user_id:
        description: 关联注册用户
        type: string
    required:
    - age
    - gender
    - name
    type: object
  domain.CustomerQuery:
    properties:
      bed_id:
        type: string
      care_level_id:
        type: string
      diet_plan_id:
        type: string
      health_manager_id:
        type: string
      id_card:
        type: string
      max_age:
        type: integer
      min_age:
        type: integer
      name:
        type: string
      phone:
        type: string
      search_key:
        description: 万能搜索框：匹配姓名或手机号
        type: string
      status:
        type: string
    type: object
  domain.DietPlan:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        description: 如"低糖餐"、"流质餐"
        type: string
      updated_at:
        type: string
      week_menu:
        description: 每周菜单
        items:
          $ref: '#/definitions/domain.WeekDayMenu'
        type: array
    required:
    - name
    type: object
  domain.ElderlyRegisterRequest:
    properties:
      age:
        description: 年龄
        type: integer
      allergy_history:
        description: 过敏史
        type: string
      bed_id:
        description: 床位分配
        type: string
      check_in_date:
        description: 入住安排详情
        type: string
      contact_address:
        description: 联系地址
        type: string
      contact_name:
        description: 紧急联系人信息
        type: string
      contact_phone:
        description: 联系电话
        type: string
      dietary_type:
        description: 膳食类型
        type: string
      gender:
        description: 性别 (男/女)
        type: string
      health_level:
        description: 健康状况记录
        type: string
      home_address:
        description: 家庭住址
        type: string
      id_card:
        description: 身份证号
        type: string
      medical_history:
        description: 既往病史
        type: string
      medication:
        description: 用药情况
        type: string
      name:
        description: 基本信息
        type: string
      nursing_level:
        description: 护理级别
        type: string
      phone_number:
        description: 联系电话
        type: string
      relationship:
        description: 关系
        type: string
      remarks:
        description: 备注说明
        type: string
    required:
    - age
    - bed_id
    - check_in_date
    - contact_name
    - contact_phone
    - dietary_type
    - gender
    - health_level
    - id_card
    - nursing_level
    - relationship
    type: object
  domain.EndServiceRequest:
    properties:
      end_date:
        type: string
    required:
    - end_date
    type: object
  domain.HealthManager:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      specialty:
        description: 专长
        type: string
      status:
        description: '"在职"/"离职"'
        type: string
      updated_at:
        type: string
    required:
    - name
    type: object
  domain.HealthManagerQuery:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      specialty:
        type: string
    type: object
  domain.OutgoingRequest:
    properties:
      created_by:
        type: string
      customer_name:
        type: string
      destination:
        type: string
      elder_id:
        type: string
      emergencycontact:
        type: string
      escort:
        type: string
      expectedreturntime:
        type: string
      note:
        type: string
      outTime:
        type: string
      remark:
        type: string
    required:
    - destination
    - emergencycontact
    - escort
    - expectedreturntime
    - outTime
    type: object
  domain.PatientLoginRequest:
    properties:
      password:
        type: string
      patientId:
        type: string
    required:
    - password
    - patientId
    type: object
  domain.PatientRegisterRequest:
    properties:
      password:
        type: string
      patientphone:
        type: string
    required:
    - password
    - patientphone
    type: object
  domain.PurchaseServiceRequest:
    properties:
      customer_id:
        type: string
      service_id:
        type: string
      start_date:
        type: string
    required:
    - customer_id
    - service_id
    - start_date
    type: object
  domain.RecordItems:
    properties:
      care_item:
        description: 护理项目
        type: string
      care_personnel:
        description: 护理人员
        type: string
      care_result:
        description: 护理结果
        type: string
      care_time:
        description: 护理时间
        type: string
      created_at:
        type: string
    required:
    - care_item
    - care_personnel
    - care_result
    - care_time
    type: object
  domain.ReturnRequest:
    properties:
      created_by:
        type: string
      id:
        type: string
      note:
        type: string
    required:
    - id
    type: object
  domain.Room:
    properties:
      capacity:
        description: 床位容量
        type: integer
      created_at:
        type: string
      description:
        type: string
      floor:
        description: 楼层
        type: integer
      id:
        type: string
      number:
        description: 房间号，如 "A101"
        type: string
      status:
        description: 状态："可用"/"已满"/"维护中"
        type: string
      type:
        description: 房间类型："单人间"/"双人间"/"多人间"
        type: string
      updated_at:
        type: string
    required:
    - number
    type: object
  domain.Service:
    properties:
      category:
        description: 服务类别："医疗"/"生活"/"娱乐"等
        type: string
      created_at:
        type: string
      description:
        type: string
      duration:
        description: TODO
        type: integer
      id:
        type: string
      name:
        description: 服务名称
        type: string
      price:
        description: 服务价格
        type: number
      status:
        description: 状态："启用"/"停用"
        type: string
      unit:
        description: 计价单位："次"/"月"/"年"
        type: string
      updated_at:
        type: string
    required:
    - name
    type: object
  domain.SetBedRequest:
    properties:
      bed_id:
        type: string
    required:
    - bed_id
    type: object
  domain.SetCareLevelRequest:
    properties:
      care_level_id:
        type: string
    required:
    - care_level_id
    type: object
  domain.SetDietPlanRequest:
    properties:
      diet_plan_id:
        type: string
    required:
    - diet_plan_id
    type: object
  domain.SetHealthManagerRequest:
    properties:
      manager_id:
        type: string
      manager_name:
        type: string
    required:
    - manager_id
    - manager_name
    type: object
  domain.UserLoginRequest:
    properties:
      password:
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  domain.UserRegisterRequest:
    properties:
      age:
        type: integer
      gender:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
    required:
    - age
    - gender
    - name
    - password
    - phone
    type: object
  domain.WeekDayMenu:
    properties:
      breakfast:
        description: 早餐
        type: string
      day:
        description: '"周一"、"周二"等'
        type: string
      dinner:
        description: 晚餐
        type: string
      lunch:
        description: 午餐
        type: string
      snack:
        description: 加餐
        type: string
    type: object
  web.CallRequest:
    properties:
      alert_id:
        type: string
      target_role:
        description: doctor, nurse, manager
        type: string
    required:
    - alert_id
    - target_role
    type: object
  web.DutyStaffInfo:
    properties:
      doctors:
        items:
          type: string
        type: array
      lastUpdated:
        type: integer
      nurses:
        items:
          type: string
        type: array
      onDutyCount:
        type: integer
    type: object
  web.TrendDataCompat:
    properties:
      count:
        type: integer
      time:
        type: string
    type: object
host: localhost:8081
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 东软顾养中心管理系统API文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: 东软顾养中心 API
  version: "1.0"
paths:
  /alerts/{id}/resolve:
    put:
      description: 将指定告警标记为已处理
      parameters:
      - description: 告警ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: 解除成功
        "404":
          description: 告警不存在
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties: true
            type: object
      summary: 解除告警
      tags:
      - 告警管理
  /analysis/logs:
    get:
      consumes:
      - application/json
      description: 分页获取存储在 MongoDB 中的报警和会话分析记录
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 获取分析与报警日志
      tags:
      - 分析管理
  /api/alerts/{id}/resolve:
    put:
      consumes:
      - application/json
      description: 处理前端点击“已处理”按钮的操作
      parameters:
      - description: 告警ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 解除告警
      tags:
      - 分析管理
  /api/services/customer-services_by_group:
    get:
      consumes:
      - application/json
      description: 分页获取所有客户购买的服务记录，按用户ID分组显示，包含用户名称和服务名称
      parameters:
      - description: 老人ID
        in: query
        name: customer_id
        type: string
      - description: 项目名称（模糊匹配）
        in: query
        name: service_name
        type: string
      - description: 状态：进行中/已结束/已取消
        in: query
        name: status
        type: string
      - default: 0
        description: 跳过数量
        in: query
        name: skip
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
      summary: 获取按用户分组的客户服务列表
      tags:
      - 服务管理
  /beds:
    get:
      consumes:
      - application/json
      description: 根据条件分页获取床位列表
      parameters:
      - description: 房间号
        in: query
        name: room_number
        type: string
      - description: 床位号
        in: query
        name: bed_number
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      - default: 0
        description: 跳过数量
        in: query
        name: skip
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
      summary: 获取床位列表
      tags:
      - 床位管理
  /beds/{id}:
    delete:
      consumes:
      - application/json
      description: 根据ID删除指定床位
      parameters:
      - description: 床位ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      summary: 删除床位
      tags:
      - 床位管理
    get:
      consumes:
      - application/json
      description: 根据ID获取床位详细信息
      parameters:
      - description: 床位ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 床位不存在
          schema:
            additionalProperties: true
            type: object
      summary: 获取床位详情
      tags:
      - 床位管理
    put:
      consumes:
      - application/json
      description: 更新床位信息
      parameters:
      - description: 床位ID
        in: path
        name: id
        required: true
        type: string
      - description: 床位信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Bed'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      summary: 更新床位
      tags:
      - 床位管理
  /beds/{id}/release:
    put:
      consumes:
      - application/json
      description: 将指定床位设置为待入住状态
      parameters:
      - description: 床位ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 释放成功
          schema:
            additionalProperties: true
            type: object
      summary: 释放床位
      tags:
      - 床位管理
  /beds/create:
    post:
      consumes:
      - application/json
      description: 创建新的床位记录
      parameters:
      - description: 床位信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CreateBed'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      summary: 创建床位
      tags:
      - 床位管理
  /beds/options/beds:
    get:
      consumes:
      - application/json
      description: 获取用于下拉选择的床位列表
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
      summary: 获取床位选项
      tags:
      - 床位管理
  /beds/options/rooms:
    get:
      consumes:
      - application/json
      description: 获取用于下拉选择的房间列表
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
      summary: 获取房间选项
      tags:
      - 床位管理
  /beds/room/{room_id}:
    get:
      consumes:
      - application/json
      description: 获取指定房间下的所有床位
      parameters:
      - description: 房间ID
        in: path
        name: room_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
      summary: 根据房间ID获取床位列表
      tags:
      - 床位管理
  /care-levels:
    get:
      consumes:
      - application/json
      description: 分页获取护理级别列表
      parameters:
      - default: 0
        description: 跳过数量
        in: query
        name: skip
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
      summary: 获取护理级别列表
      tags:
      - 护理级别管理
    post:
      consumes:
      - application/json
      description: 创建新的护理级别
      parameters:
      - description: 护理级别信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CareLevel'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      summary: 创建护理级别
      tags:
      - 护理级别管理
  /care-levels/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定的护理级别
      parameters:
      - description: 护理级别ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的ID
          schema:
            additionalProperties: true
            type: object
      summary: 删除护理级别
      tags:
      - 护理级别管理
    get:
      consumes:
      - application/json
      description: 根据ID获取护理级别详细信息
      parameters:
      - description: 护理级别ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 护理级别不存在
          schema:
            additionalProperties: true
            type: object
      summary: 获取护理级别详情
      tags:
      - 护理级别管理
    put:
      consumes:
      - application/json
